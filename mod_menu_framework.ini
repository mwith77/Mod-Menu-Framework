[dataSources]

extraSourceSlots = 512

maxFrameworkSources = 512


[settings]

;   lockedTextColour   a palette entry such as t2-red, or #RRGGBB, or
;                      #RRGGBBAA. Empty draws it in the ordinary colour
;   lockedTextBreaks   blank lines between the description and it, 0 to 4
;   lockedTextBold     1 puts it in bold

lockedTextColour = t2-red
lockedTextBreaks = 2
lockedTextBold   = 0

; Default position of the Mod Configuration button on the options page. -1 puts it where the page definition file draws it.
rowPosition = -1

; Sets the position with the in game slider. Do not change unless you know what you are doing.
rowPositionSetting = menuPosition
